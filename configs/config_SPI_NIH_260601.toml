
# This config file is for June, 2026 pig experiments at NIH with Free.XL system.
# 
# Date: 26-06-01
# 
# ------------------------------------------------------------------------------------
[system]
max_grad          =    16 			# [mT/m] 		Free.Max -> 15	; Free.XL -> 20  [more like 16]  ; Aera -> 24
max_slew          =    90			# [T/m/s]		Free.Max -> 40  ; Free.XL -> 120 [use max 100]   ; Aera -> 120
grad_raster_time  =  10e-6 			# [s]
rf_raster_time    =   1e-6 			# [s]
rf_ringdown_time  =  10e-6 			# [s]
rf_dead_time      = 200e-6 			# [s]
adc_dead_time     =  10e-6 			# [s]

# ------------------------------------------------------------------------------------

# Note: 
# in XYZ-TRA mode this is the direction mapping, not sure about the signs 
# TRA: * x -> y [AP] ; * y -> x [LR] ; * z -> z [FH]
# SAG: * x -> z [FH] ; * y -> y [AP] ; * z -> x [LR]
# COR: * x -> z [HF] ; * y -> x [LR] ; * z -> y [AP]
# NOTE: Select XYZ-TRA in the scanner and then select COR for the correct SLAB.
[Orientation] 
pulseq_ort_map 	= 'XYZ-TRA'			# Pulseq Orientation Mappings: XYZ-TRA, XYZ-SAG, XYZ-COR
plane_rot_axis 	= 'x' 				# 'x', 'y', 'z'
rf_axis 		= 'y' 				# 'x', 'y', 'z'

# ------------------------------------------------------------------------------------
# 26-06-01: 
# * changed the fov from [28, 20] to [28, 25].
# * changed the slab thickness from 150 mm to 120 mm. (FWHM) 
[acquisition]	
# Contrast
contrast     	= 'trueFISP' 		# can be: trueFISP, FISP, or FLASH.
# RF	
excitation      = 'slr'				# Options: 'sinc' only for now, update: SLR
tbwp            = 5 				# 4 vs 6? 
flip_angle      = 65 				# degrees 	
rf_duration     = 1.1e-3 			# [s] 		# TODO: Check later!!

# Dimensions
resolution      = 3.5 				# [mm]
fov             = [28.0, 25.0] 		# [cm] [Spiral FOV, Radial FOV] 
slab_thickness 	= 120 				# [mm] 
# Timing
TR              = 0 				# [ms], 0 for min TR
TE              = 0 				# [ms], list of echo times, 0 for min TE and single echo
n_dummy         = 100 				# Number of dummy scans #TODO Catalyzation option for future

# ------------------------------------------------------------------------------------
# 26-06-01. 

[spiral]
slew_ratio   	= 1.0 			
grad_ratio   	= 0.99
ro_duration  	= 3e-3 				# [s] Readout duration
adc_dwell    	= 2e-6 				# [s]
arm_ordering 	= 'linear'		# 'linear', 'ga', 'bit-reverse'

GA_steps     	= -1 				# Number of unique GA_steps, determines the duration of 1 repetition. Only enabled if 'ga' is selected.
GA_angle     	= 137.51 			# [deg] Full spoke 137.51
rotate_grads 	= true
inplane_os   	= 1.5 				# In-plane oversampling factor. Number of interleaves will be multiplied by this factor.
grad_rew_method = 'gropt' 			# 'gropt', 'ext_trap_area', 'exact_time', 'm1_nayak' - What method to use design spiral rewinders. GrOpt requires successfull compilation of the library.
rewinder_time   = 2e-3 				# [s] Exact rew time for 'grad_rew_method' = 'exact_time', max rew time for grad_rew_method = 'gropt'
M1_nulling	  	= false 			# If true, rewinder will be designed to null the M1 moment of the spiral readout.

# ------------------------------------------------------------------------------------
# 26-06-01. 
# * separated radial foorprint parameters from the spiral ones.
# * changed disk -> plane
[radial]
plane_ordering 	= 'modga' 			# 'ga', 'tinyga', 'modga'
hex_sampling 	= false 			# If true, additional rotation in [PE, SL] plane for hexagonal sampling.
plane_GA_steps 	= 90 				# Number of unique GA_steps for disk ordering, determines the number of disks. Only enabled if 'ga' is selected.
plane_GA_angle 	= 111.25 			# [deg] Half spoke 111.25 or 68.75. It selects 68.75 automatically.
plane_tinyGA_N 	= 3 				# 180 / (N + GR - 1). Applies when plane_ordering is set to 'tinyga'. 1 is normal GA.
plane_aspect_ratio = -1 			# Aspect ratio for modGA. If negative, it will be calculated based on the acquisition parameters.
plane_os 		= 1.0 				# Through-plane oversampling factor. Number of disks will be multiplied by this factor.

# ------------------------------------------------------------------------------------
# 26-06-06. 
# * adding view order options.
# Available view orders are:
# 1) projection-mode: 
# plane (radial spoke) changes last
#   1.1) fully-sampled
# 		- all in-plane spirals are acquired for one plane before moving to the next plane.
# 		  in-plane spirals are always linear for this.
# 		- PARAMETERS:
# 			- plane_ordering (under radial): 'ga', 'tiny_ga', 'modga'  (plane_tinyGA_N = 1)
#   1.2) undersampled
#		- only a subset of in-plane spirals are acquired for each plane before moving to the next plane.
# 		- PARAMETERS:
# 			- plane_ordering (under radial): 'ga', 'tiny_ga', 'modga'  (plane_tinyGA_N > 1)
# 			- undersampling_factor (under view_order): > 1, determines how many spirals are skipped for each acquired spiral. 
# 														For example, if undersampling_factor = 2, every other spiral is acquired.
# 			- arm_ordering (under spiral): 
# 2) 3d-mode:
# here plane (radial spoke) changes each TR. Spiral may or may not change. I am only considering the case where it changes. 
# PARAMETERS:
# - plane_ordering (under radial): 'ga', 'tiny_ga', 'modga'  (plane_tinyGA_N = 1)
# - arm_ordering (under spiral): 'ga', 'tiny_ga', 'bit-rev' 
[view_order]
view_order_mode 	= 'projection-mode' 		# 1) projection-mode ; 2) 3d-mode
view_order_submode 	= 'undersampled' 			# Applies for 1) 1.1) fully-sampled ; 1.2) undersampled
undersampling_factor = 2 						# Applies for 1) 1.2) undersampled. > 1, determines how many spirals are skipped for each acquired spiral.

# ------------------------------------------------------------------------------------
# 26-06-01.
# * changed from seq_pp -> seq_pp_260601 and seq_meta -> seq_meta_260601 
[user_settings]
seq_pp_folder 	= "seq_pp_sweep"
seq_meta_folder = "seq_meta_sweep"
write_seq    	= true
filename_ext 	= '' 				# This will be attached to the filename
show_plots   	= false 
detailed_rep 	= true


# ------------------------------------------------------------------------------------
# ==================== Aera ====================
# frequencies = [700, 1164] 	 	# Aera
# bandwidths  = [100, 250]   		# Aera
# ==================== Free.XL ====================
# frequencies = [685, 1120] 		# Free.XL
# bandwidths  = [100, 200] 			# Free.XL 
# ==================== Free.Max ====================
# frequencies = [595, 1030]  		# Free.max
# bandwidths  = [130, 250]   		# Free.max

[acoustic_resonances]
frequencies = [685, 1120] # Free.XL
bandwidths  = [100, 200] # Free.XL 
